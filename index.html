<!doctype html>
<html lang="ru"><head>

<title>Alina — Portfolio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
#viewport{width:100vw;height:100dvh;display:flex;overflow-x:auto;overflow-y:hidden;
scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;touch-action:pan-x}
#viewport::-webkit-scrollbar{display:none}.page{flex:0 0 100vw;width:100vw;height:100dvh;
display:grid;place-items:center;scroll-snap-align:center;scroll-snap-stop:always}
.page img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}

.page{position:relative}
.page .hotspot{
  position:absolute;
  z-index:3;
  display:block;
  cursor:pointer;
  background:transparent;
}
.page .hotspot.video{
  left:47.37%;
  top:47.78%;
  width:5.32%;
  height:4.40%;
}
.page .hotspot.online{
  left:43.40%;
  top:47.75%;
  width:13.24%;
  height:4.40%;
}

.hud{position:fixed;z-index:2;left:20px;right:20px;bottom:18px;color:white;mix-blend-mode:difference;
font:11px Arial;letter-spacing:.08em;display:flex;justify-content:space-between;pointer-events:none}
@media(max-width:700px){.hud{left:12px;right:12px;bottom:12px}.hint{display:none}}

<div class="hud"><span id="counter">01 / 22</span><span class="hint">← → &nbsp; / &nbsp; scroll &nbsp; / &nbsp; swipe</span></div>
<script>
const v=document.getElementById('viewport'),p=[...document.querySelectorAll('.page')],c=document.getElementById('counter');
function n(){return Math.min(p.length-1,Math.max(0,Math.round(v.scrollLeft/innerWidth)))}
function u(){c.textContent=String(n()+1).padStart(2,'0')+' / '+String(p.length).padStart(2,'0')}
function go(d){p[Math.min(p.length-1,Math.max(0,n()+d))].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(1)}
if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1)}
if(e.key==='Home'){e.preventDefault();p[0].scrollIntoView({behavior:'smooth',inline:'center'})}
if(e.key==='End'){e.preventDefault();p[p.length-1].scrollIntoView({behavior:'smooth',inline:'center'})}});
v.addEventListener('scroll',u,{passive:true});u();
</script></body></html>
