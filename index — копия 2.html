<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Портфолио — Алина Полежаева</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: #080808; color: #fff; }
  body { overflow: hidden; font-family: Arial, sans-serif; }
  #portfolio { display: flex; flex-direction: row; align-items: center; gap: 0; width: 100vw; height: 100dvh; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scroll-behavior: smooth; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  #portfolio::-webkit-scrollbar { display: none; }
  .page { position: relative; flex: 0 0 auto; height: 100dvh; width: auto; scroll-snap-align: start; overflow: hidden; background: #080808; }
  .page canvas { display: block; height: 100%; width: 100%; object-fit: contain; }
  .link-layer { position: absolute; inset: 0; pointer-events: none; }
  .link-layer a { position: absolute; display: block; pointer-events: auto; background: transparent; cursor: pointer; outline-offset: 3px; }
  .link-layer a:hover { background: rgba(255,255,255,.08); }
  .counter { position: fixed; z-index: 10; right: max(14px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); padding: 7px 10px; border-radius: 20px; background: rgba(0,0,0,.58); color: rgba(255,255,255,.8); font-size: 12px; letter-spacing: .04em; pointer-events: none; }
  .hint { position: fixed; z-index: 10; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 7px 11px; border-radius: 20px; background: rgba(0,0,0,.58); color: rgba(255,255,255,.7); font-size: 11px; white-space: nowrap; pointer-events: none; transition: opacity .5s ease; }
  .hint.hidden { opacity: 0; }
  #error { display:none; position:fixed; inset:0; z-index:20; background:#080808; padding:32px; color:#fff; line-height:1.5; }
  @media (prefers-reduced-motion: reduce) { #portfolio { scroll-behavior: auto; } }
</style>
</head>
<body>
<main id="portfolio" aria-label="Портфолио, горизонтальная прокрутка"></main>
<div class="counter" id="counter">1 / 22</div>
<div class="hint" id="hint">Листайте влево и вправо</div>
<div id="error">Не удалось загрузить портфолио. Проверьте, что файлы <b>Web.pdf</b> и <b>Mobile.pdf</b> находятся рядом с index.html.</div>
<script type="module">
  import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

  const root = document.getElementById('portfolio');
  const counter = document.getElementById('counter');
  const hint = document.getElementById('hint');
  const errorBox = document.getElementById('error');
  const isMobile = window.matchMedia('(max-width: 700px)').matches;
  const pdfFile = isMobile ? 'Mobile.pdf' : 'Web.pdf';
  let pageEls = [];

  function fitScale(page, availableHeight) {
    const base = page.getViewport({ scale: 1 });
    // Keep every PDF page at the viewport height, preserving its proportions.
    return availableHeight / base.height;
  }

  async function renderPage(pdf, pageNumber) {
    const page = await pdf.getPage(pageNumber);
    const height = window.innerHeight || document.documentElement.clientHeight;
    const scale = fitScale(page, height);
    const viewport = page.getViewport({ scale });
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    const section = document.createElement('section');
    section.className = 'page';
    section.style.width = `${viewport.width}px`;
    section.style.height = `${height}px`;
    section.setAttribute('aria-label', `Страница ${pageNumber}`);

    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(viewport.width * dpr);
    canvas.height = Math.ceil(viewport.height * dpr);
    canvas.style.width = `${viewport.width}px`;
    canvas.style.height = `${viewport.height}px`;
    const context = canvas.getContext('2d', { alpha: false });
    context.setTransform(dpr, 0, 0, dpr, 0, 0);
    section.appendChild(canvas);

    const layer = document.createElement('div');
    layer.className = 'link-layer';
    section.appendChild(layer);

    await page.render({ canvasContext: context, viewport }).promise;

    const annotations = await page.getAnnotations({ intent: 'display' });
    for (const annotation of annotations) {
      if (annotation.subtype !== 'Link' || !annotation.url) continue;
      const rect = viewport.convertToViewportRectangle(annotation.rect);
      const left = Math.min(rect[0], rect[2]);
      const top = Math.min(rect[1], rect[3]);
      const width = Math.abs(rect[2] - rect[0]);
      const linkHeight = Math.abs(rect[3] - rect[1]);
      const a = document.createElement('a');
      a.href = annotation.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.setAttribute('aria-label', 'Открыть ссылку из портфолио в новой вкладке');
      a.style.left = `${left}px`;
      a.style.top = `${top}px`;
      a.style.width = `${width}px`;
      a.style.height = `${linkHeight}px`;
      layer.appendChild(a);
    }
    return section;
  }

  async function init() {
    try {
      const pdf = await pdfjsLib.getDocument(pdfFile).promise;
      counter.textContent = `1 / ${pdf.numPages}`;
      for (let i = 1; i <= pdf.numPages; i++) {
        const section = await renderPage(pdf, i);
        root.appendChild(section);
        pageEls.push(section);
      }
      const observer = new IntersectionObserver(entries => {
        const visible = entries.filter(e => e.isIntersecting).sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (visible) {
          const index = pageEls.indexOf(visible.target);
          if (index >= 0) counter.textContent = `${index + 1} / ${pdf.numPages}`;
        }
      }, { root, threshold: [0.25, 0.5, 0.75] });
      pageEls.forEach(el => observer.observe(el));
      setTimeout(() => hint.classList.add('hidden'), 3500);
    } catch (error) {
      console.error(error);
      errorBox.style.display = 'block';
    }
  }
  init();
</script>
</body>
</html>
